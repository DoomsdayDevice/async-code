services:
  frontend:
    build:
      context: ./async-code-web
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-9020}:3000"
    environment:
      - NODE_ENV=development
    env_file:
      - ./async-code-web/.env
    # volumes:
    #   - ./async-code-web:/app

    depends_on:
      - backend

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-9010}:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=True
    env_file:
      - ./server/.env
    volumes:
      # - ./server:/app
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres
      - claude-automation-build
      - codex-automation-build

  postgres:
    image: postgres:16-alpine
    container_name: async-code-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-asynccode}
      - POSTGRES_USER=${DB_USER:-asynccode}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-asynccode}
    ports:
      - "${DB_EXPOSE_PORT:-9432}:5432"
    volumes:
      - ./.data:/var/lib/postgresql/data

  claude-automation-build:
    build:
      context: .
      dockerfile: Dockerfile.claude-automation
      tags:
        - claude-code-automation:latest
    command: ["echo", "Claude Code automation image built"]

  # Сервис-сборщик образа для Codex CLI, чтобы backend не пытался тянуть его из реестра
  codex-automation-build:
    build:
      context: .
      dockerfile: Dockerfile.codex-automation
      tags:
        - codex-automation:latest
    command: ["echo", "Codex automation image built"]

volumes:
  docker_socket:
